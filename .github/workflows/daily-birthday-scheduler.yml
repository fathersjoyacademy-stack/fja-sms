name: Daily Birthday SMS Scheduler (9:00 AM GMT)

on:
  schedule:
    # 09:00 UTC / GMT daily
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-daily-birthday-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd functions && npm install

      - name: Execute Server-Level Unattended Birthday Dispatch
        env:
          HUBTEL_CLIENT_ID: ${{ secrets.HUBTEL_CLIENT_ID || 'cvnhobyo' }}
          HUBTEL_CLIENT_SECRET: ${{ secrets.HUBTEL_CLIENT_SECRET || 'rnrxvuxd' }}
          HUBTEL_SENDER_ID: ${{ secrets.HUBTEL_SENDER_ID || 'FathersJoy' }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY || 'fja-sms-authorized-key-2026' }}
        run: |
          node scripts/unattended-cron-runner.js
